version: "3.8"

services:
  scrape:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrape
    ports:
      - "127.0.0.1:10001:10001"
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - flaresolverr
      - redis
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: scrape-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
